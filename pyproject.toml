[project]
name = "hxfinancebot"
version = "0.1.0"
description = "Stock screening funnel with Google Sheets, Telegram bot, and earnings scanner"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

[project.optional-dependencies]
review = [
    "google-api-python-client>=2.90.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "requests>=2.31.0",
]
earnings = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "yfinance>=1.4.1",
    "requests>=2.31.0",
    "google-api-python-client>=2.90.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
]
funnel = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=1.4.1",
    "requests>=2.31.0",
    "google-api-python-client>=2.90.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "finvizfinance>=1.3.0",
    "lxml>=4.9.0",
    "tqdm",
]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
dev = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "yfinance>=1.4.1",
    "requests>=2.31.0",
    "google-api-python-client>=2.90.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "finvizfinance>=1.3.0",
    "lxml>=4.9.0",
    "tqdm",
]

[tool.setuptools]
packages = {find = {}}

[tool.setuptools.package-dir]
"" = "."

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
