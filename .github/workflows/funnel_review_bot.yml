name: Funnel - Telegram Review Bot

"on":
  schedule:
    # GitHub cron uses UTC. This polls Telegram for review-button clicks.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funnel-review-v3
  queue: max
  cancel-in-progress: false

jobs:
  telegram-review-bot:
    name: Process Telegram Review Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth requests

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m compileall -q funnel tests

      - name: Process review actions
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: Stock Summary USD
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m funnel.review_bot
