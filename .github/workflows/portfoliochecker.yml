name: Portfolio Monitor

on:
  schedule:
    - cron: '0 14 * * 1-5'   # Monday-Friday at 14:00 UTC
  workflow_dispatch:          # manual trigger from GitHub Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updates (flags, sales_log, last_update_id)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add profit_flags.csv sales_log.csv last_update_id.txt
          git diff --staged --quiet || git commit -m "Update flags and logs [skip ci]"
          git push
