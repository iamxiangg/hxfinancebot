# NEW — Funnel Pilot Step 2: Read-only Google Sheets test

name: Funnel - Test Sheet Reader

on:
  workflow_dispatch:
    inputs:
      preview_count:
        description: "Number of ticker rows to display"
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: funnel-sheet-reader
  cancel-in-progress: false

jobs:
  test-sheet-reader:
    name: Test Stock Summary Reader
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google API dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m py_compile funnel/sheet_reader.py
          echo "Python syntax check passed."

      - name: Run read-only Google Sheets test
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_NAME: "Xiang Stock Analysis"
          GOOGLE_WORKSHEET_NAME: "Stock Summary USD"
          PREVIEW_COUNT: ${{ inputs.preview_count }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python funnel/sheet_reader.py