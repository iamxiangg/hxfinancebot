name: Short_Squeeze_Scanner

on:
  schedule:
    - cron: "0 15 * * 1-5" # Runs at 10:00 AM EST (15:00 UTC) Mon-Fri
  workflow_dispatch:

jobs:
  squeeze-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencies
        run: pip install yfinance pandas requests
      - name: Run Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python short_squeeze_scan.py
