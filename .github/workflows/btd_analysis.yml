name: BTD_Analysis

on:
  schedule:
    - cron: "0 14 * * 1-5"  # Runs at 14:00 UTC (10:00 PM SGT), Monday to Friday
  workflow_dispatch:       # Allows you to manually trigger it from the Actions tab

jobs:
  run-btd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas gspread oauth2client pytz requests

      - name: Run BTD Script
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Ensure this matches the exact filename in your archive/ folder
        run: python archive/btd_analysis.py
