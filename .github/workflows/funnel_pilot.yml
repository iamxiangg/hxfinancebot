# NEW — Funnel Pilot Steps 2 and 3:
# Read-only Google Sheets test and common signal-schema test

name: Funnel - Pilot

on:
  workflow_dispatch:
    inputs:
      preview_count:
        description: "Number of ticker rows to display"
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: funnel-pilot
  cancel-in-progress: false

jobs:
  test-funnel-foundation:
    name: Test Funnel Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google API dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m py_compile funnel/google_client.py
          python -m py_compile funnel/sheet_reader.py
          python -m py_compile funnel/signal_schema.py
          python -m py_compile tests/test_signal_schema.py
          echo "Python syntax checks passed."

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Run signal schema demonstration
        run: |
          set -euo pipefail
          python -m funnel.signal_schema

      - name: Run read-only Google Sheets test
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: "Stock Summary USD"
          PREVIEW_COUNT: ${{ inputs.preview_count }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m funnel.sheet_reader