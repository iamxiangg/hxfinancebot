# VERSION: 2026-06-23-CONTROLLED-PROMOTION-WORKFLOW-1

name: Funnel - Pilot

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: Pilot mode
        required: true
        default: reader
        type: choice
        options:
          - reader
          - congress-dry-run
          - pilot-sheet-setup
          - pilot-signal-log-write
          - pilot-funnel-write
          - pilot-full-run
          - promotion-dry-run
          - promotion-apply

      preview_count:
        description: Number of records to display
        required: false
        default: "10"

      min_conviction:
        description: Minimum conviction for Congress near-miss signals
        required: false
        default: "15"

      promotion_ticker:
        description: Exact ticker to promote, for example BSX
        required: false
        default: ""

      confirm_pilot_sheet_setup:
        description: Select YES only when running pilot-sheet-setup
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"

      confirm_pilot_signal_log_write:
        description: Select YES only when running pilot-signal-log-write
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"

      confirm_pilot_funnel_write:
        description: Select YES only when running pilot-funnel-write
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"

      confirm_pilot_full_run:
        description: Select YES only when running pilot-full-run
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"

      confirm_master_promotion:
        description: Select YES only when intentionally writing to Stock Summary USD
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"

permissions:
  contents: read

concurrency:
  group: funnel-review-v3
  queue: max
  cancel-in-progress: false

jobs:
  test-funnel:
    name: Test and run Funnel Pilot
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pilot dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth
          python -m pip install pandas requests yfinance python-telegram-bot

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m compileall -q funnel tests
          echo "Python syntax checks passed."

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Reject unconfirmed pilot sheet setup
        if: ${{ inputs.mode == 'pilot-sheet-setup' && inputs.confirm_pilot_sheet_setup != 'YES' }}
        run: |
          echo "pilot-sheet-setup requires confirm_pilot_sheet_setup=YES."
          exit 1

      - name: Reject unconfirmed signal-log write
        if: ${{ inputs.mode == 'pilot-signal-log-write' && inputs.confirm_pilot_signal_log_write != 'YES' }}
        run: |
          echo "pilot-signal-log-write requires confirm_pilot_signal_log_write=YES."
          exit 1

      - name: Reject unconfirmed funnel write
        if: ${{ inputs.mode == 'pilot-funnel-write' && inputs.confirm_pilot_funnel_write != 'YES' }}
        run: |
          echo "pilot-funnel-write requires confirm_pilot_funnel_write=YES."
          exit 1

      - name: Reject unconfirmed consolidated full run
        if: ${{ inputs.mode == 'pilot-full-run' && inputs.confirm_pilot_full_run != 'YES' }}
        run: |
          echo "pilot-full-run requires confirm_pilot_full_run=YES."
          exit 1

      - name: Reject unconfirmed master promotion
        if: ${{ inputs.mode == 'promotion-apply' && inputs.confirm_master_promotion != 'YES' }}
        run: |
          echo "promotion-apply requires confirm_master_promotion=YES."
          exit 1

      - name: Reject blank promotion ticker
        if: ${{ inputs.mode == 'promotion-apply' && inputs.promotion_ticker == '' }}
        run: |
          echo "promotion-apply requires an exact promotion_ticker."
          exit 1

      - name: Run read-only Google Sheets test
        if: ${{ inputs.mode == 'reader' }}
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: Stock Summary USD
          PREVIEW_COUNT: ${{ inputs.preview_count }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m funnel.sheet_reader

      - name: Run Congress dry-run comparison
        if: ${{ inputs.mode == 'congress-dry-run' }}
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: Stock Summary USD
          MIN_CONVICTION: ${{ inputs.min_conviction }}
          FUNNEL_OUTPUT_DIR: funnel_output
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m funnel.congress_dry_run

      - name: Create and verify pilot worksheet headers
        if: ${{ inputs.mode == 'pilot-sheet-setup' && inputs.confirm_pilot_sheet_setup == 'YES' }}
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: Stock Summary USD
          CONFIRM_PILOT_SHEET_SETUP: ${{ inputs.confirm_pilot_sheet_setup }}
          FUNNEL_OUTPUT_DIR: funnel_output
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m funnel.pilot_sheet_setup

      - name: Write current Congress signals to pilot signal log
        if: ${{ inputs.mode == 'pilot-signal-log-write' && inputs.confirm_pilot_signal_log_write == 'YES' }}
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: Stock Summary USD
          MIN_CONVICTION: ${{ inputs.min_conviction }}
          CONFIRM_PILOT_SIGNAL_LOG_WRITE: ${{ inputs.confirm_pilot_signal_log_write }}
          FUNNEL_OUTPUT_DIR: funnel_output
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m funnel.pilot_signal_log_writer

      - name: Write current funnel and pending candidate data
        if: ${{ inputs.mode == 'pilot-funnel-write' && inputs.confirm_pilot_funnel_write == 'YES' }}
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: Stock Summary USD
          MIN_CONVICTION: ${{ inputs.min_conviction }}
          CONFIRM_PILOT_FUNNEL_WRITE: ${{ inputs.confirm_pilot_funnel_write }}
          FUNNEL_OUTPUT_DIR: funnel_output
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m funnel.pilot_funnel_writer

      - name: Run consolidated pilot refresh
        if: ${{ inputs.mode == 'pilot-full-run' && inputs.confirm_pilot_full_run == 'YES' }}
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: Stock Summary USD
          MIN_CONVICTION: ${{ inputs.min_conviction }}
          CONFIRM_PILOT_FULL_RUN: ${{ inputs.confirm_pilot_full_run }}
          FUNNEL_OUTPUT_DIR: funnel_output
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m funnel.pilot_full_runner

      - name: Run approved-ticker promotion dry run
        if: ${{ inputs.mode == 'promotion-dry-run' }}
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: Stock Summary USD
          PREVIEW_COUNT: ${{ inputs.preview_count }}
          FUNNEL_OUTPUT_DIR: funnel_output
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m funnel.promotion_dry_run

      - name: Apply one controlled ticker promotion
        if: ${{ inputs.mode == 'promotion-apply' && inputs.confirm_master_promotion == 'YES' }}
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: Stock Summary USD
          PROMOTION_TICKER: ${{ inputs.promotion_ticker }}
          CONFIRM_MASTER_PROMOTION: ${{ inputs.confirm_master_promotion }}
          FUNNEL_OUTPUT_DIR: funnel_output
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m funnel.promotion_apply

      - name: Upload funnel output
        if: ${{ success() && inputs.mode != 'reader' }}
        uses: actions/upload-artifact@v4
        with:
          name: funnel-${{ inputs.mode }}-${{ github.run_number }}
          path: funnel_output/
          if-no-files-found: warn
          retention-days: 14