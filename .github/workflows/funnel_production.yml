# VERSION: 2026-06-23-FUNNEL-PRODUCTION-WORKFLOW-1

name: Funnel - Production

"on":
  workflow_dispatch:
    inputs:
      min_conviction:
        description: Minimum conviction for Congress near-miss signals
        required: false
        default: "15"

      telegram_mode:
        description: Telegram behaviour for this run
        required: true
        default: CHANGES_ONLY
        type: choice
        options:
          - CHANGES_ONLY
          - TEST
          - OFF

      confirm_production_run:
        description: Select YES to refresh all three funnel sheets
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"

permissions:
  contents: read

# Use the same group as Funnel - Pilot.
# Pilot and production sheet writes cannot overlap.
concurrency:
  group: funnel-pilot
  cancel-in-progress: false

jobs:
  production-refresh:
    name: Run Funnel Production Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth
          python -m pip install pandas requests yfinance python-telegram-bot

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m compileall -q funnel tests
          echo "Python syntax checks passed."

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Reject unconfirmed production refresh
        if: ${{ inputs.confirm_production_run != 'YES' }}
        run: |
          echo "Production refresh requires confirm_production_run=YES."
          exit 1

      - name: Run production refresh and Telegram notifier
        if: ${{ inputs.confirm_production_run == 'YES' }}
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: Stock Summary USD

          MIN_CONVICTION: ${{ inputs.min_conviction }}
          CONFIRM_PRODUCTION_RUN: ${{ inputs.confirm_production_run }}

          TELEGRAM_MODE: ${{ inputs.telegram_mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MAX_ATTEMPTS: "3"
          TELEGRAM_TIMEOUT_SECONDS: "30"

          FUNNEL_OUTPUT_DIR: funnel_output
          PYTHONUNBUFFERED: "1"

        run: |
          set -euo pipefail
          python -m funnel.production_runner

      - name: Upload production artefacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: funnel-production-${{ github.run_number }}
          path: funnel_output/
          if-no-files-found: error
          retention-days: 30