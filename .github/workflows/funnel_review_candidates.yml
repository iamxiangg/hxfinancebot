name: Funnel - Review Candidates

"on":
  schedule:
    # GitHub cron uses UTC. 12:00 UTC = 20:00 Singapore time.
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      min_conviction:
        description: Minimum conviction for Congress near-miss signals
        required: false
        default: "15"
      btd_enrich_limit:
        description: Maximum candidates to enrich in one run
        required: false
        default: "10"
      review_sources:
        description: Comma-separated sources to include
        required: false
        default: "congress,manual"
      send_telegram_reviews:
        description: Send Telegram review cards
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: funnel-review-v2
  cancel-in-progress: false

jobs:
  review-candidates:
    name: Refresh BTD Candidate Review Queue
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth
          python -m pip install pandas requests yfinance python-telegram-bot

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m compileall -q funnel tests

      - name: Run unit tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v

      - name: Resolve settings
        env:
          INPUT_MIN_CONVICTION: ${{ inputs.min_conviction }}
          INPUT_BTD_ENRICH_LIMIT: ${{ inputs.btd_enrich_limit }}
          INPUT_REVIEW_SOURCES: ${{ inputs.review_sources }}
          INPUT_SEND_TELEGRAM_REVIEWS: ${{ inputs.send_telegram_reviews }}
        run: |
          set -euo pipefail
          echo "MIN_CONVICTION=${INPUT_MIN_CONVICTION:-15}" >> "$GITHUB_ENV"
          echo "BTD_ENRICH_LIMIT=${INPUT_BTD_ENRICH_LIMIT:-10}" >> "$GITHUB_ENV"
          echo "REVIEW_SOURCES=${INPUT_REVIEW_SOURCES:-congress,manual}" >> "$GITHUB_ENV"
          echo "SEND_TELEGRAM_REVIEWS=${INPUT_SEND_TELEGRAM_REVIEWS:-true}" >> "$GITHUB_ENV"

      - name: Refresh candidates
        env:
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: Stock Summary USD
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -m funnel.review_candidates
