name: Gamma Squeeze Daily Scan

on:
  schedule:
    # Runs daily at 8:30 AM UTC (optional: adjust your timezone)
    - cron: '30 8 * * 1-5'   # Monday to Friday, 30 mins after market open?
  workflow_dispatch:          # Allow manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run gamma squeeze scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/gamma_screener.py