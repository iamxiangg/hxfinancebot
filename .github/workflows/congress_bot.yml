name: Run Political Disclosure Bot

on:
  schedule:
    - cron: "10 11 * * *"
  workflow_dispatch: # Allows you to manually trigger it anytime from the GitHub UI

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Speeds up subsequent runs by caching dependencies

      - name: Install Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth
          python -m pip install requests yfinance

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m compileall -q funnel scanners tactical

      - name: Run Congress Bot Script
        env:
          # Injects your secure bot credentials into the runner environment
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLITICAL_DISCLOSURE_SCOPE: "all"
          POLITICAL_DIGEST_ENABLED: "true"
          POLITICAL_DIGEST_LEGACY_OUTPUT: "false"
          POLITICAL_DIGEST_SEND_TELEGRAM: "true"
          POLITICAL_DIGEST_SEND_EMPTY: "true"
          POLITICAL_DIGEST_MAX_DETAILED_FLAGS: "3"
          POLITICAL_DIGEST_HARD_MAX_DETAILED_FLAGS: "5"
          POLITICAL_BACKFILL_TRADE_THRESHOLD: "200"
          POLITICAL_BACKFILL_FILING_THRESHOLD: "25"
          POLITICAL_BACKFILL_TICKER_THRESHOLD: "50"
          POLITICAL_FLAG_PURCHASE_LOW: "100000"
          POLITICAL_FLAG_CALL_LOW: "100000"
          POLITICAL_FLAG_SALE_LOW: "100000"
          POLITICAL_BROAD_MIN_BUYERS: "2"
          POLITICAL_CONCENTRATION_THRESHOLD: "0.70"
          PYTHONUNBUFFERED: "1"
        run: python -m tactical.congress_runner
