name: Run Congress Tracker Bot

on:
  schedule:
    # 11:00 AM UTC converts directly to 7:00 PM SGT
    # Runs *every day* (Mon-Sun) to match your "everyday" requirement
    - cron: "0 11 * * *"
  workflow_dispatch: # Allows you to manually trigger it anytime from the GitHub UI

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Speeds up subsequent runs by caching dependencies

      - name: Install Dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth
          python -m pip install requests yfinance

      - name: Check Python syntax
        run: |
          set -euo pipefail
          python -m compileall -q funnel scanners tactical

      - name: Run Congress Bot Script
        env:
          # Injects your secure bot credentials into the runner environment
          GCP_SERVICE_ACCOUNT_FILE: ${{ secrets.GCP_SERVICE_ACCOUNT_FILE }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python -m tactical.congress_runner
