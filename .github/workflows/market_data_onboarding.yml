name: HX Market Data Onboarding

"on":
  workflow_dispatch:
  schedule:
    # Pull urgent L5 market-structure work twice per hour. P0 requests are served first.
    - cron: "17,47 * * * *"
  push:
    paths:
      - ".github/workflows/market_data_onboarding.yml"
      - "tactical/l5_market_structure_refresh_runner.py"

permissions:
  contents: read

concurrency:
  group: hx-market-data-onboarding
  cancel-in-progress: false

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Process and persist queued L5 market structure work
        env:
          HX_MARKET_INGEST_URL: ${{ vars.HX_MARKET_INGEST_URL }}
          HX_MARKET_INGEST_SECRET: ${{ secrets.HX_MARKET_INGEST_SECRET }}
          PYTHONUNBUFFERED: "1"
          YAHOO_MAX_CONCURRENT_REQUESTS: "1"
          YAHOO_MIN_INTERVAL_SECONDS: "0.5"
          YAHOO_RETRY_LIMIT: "3"
        run: |
          set -euo pipefail
          python -m tactical.l5_market_structure_refresh_runner --work-limit 50

      - name: Upload L5 market-structure refresh artefact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: l5-market-structure-refresh
          path: funnel_output/l5_market_structure_refresh
          if-no-files-found: warn
